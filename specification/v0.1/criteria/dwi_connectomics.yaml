# Criteria for the dwi_connectomics profile.
# Source: Spec Blueprint §16 (criterion contract), Paper 1 §19-20 (finding
# structure), Output Tech Spec §12 (finding schema).
#
# A criterion evaluates one or more variables/metrics against a profile
# reference and returns {satisfied | finding | unknown | not_applicable |
# error}. A finding preserves criterion ID/version, observed condition,
# reference condition, lifecycle origin, category, severity + basis,
# confidence, evidence refs, potential effects, recommended actions, and
# empirical status — all kept separate.

version: 0.1.0

criteria:

  # ─────────────────────────────────────────────────────────────────────────
  # VECTA-DWI-014 — Complementary phase-encoding reference unavailable
  # Fully worked example. Every other criterion in v0.1 should follow this
  # shape.
  # ─────────────────────────────────────────────────────────────────────────
  - criterion_id: VECTA-DWI-014
    version: 0.1.0
    name: complementary_phase_encoding_unavailable
    lifecycle_origin: L1_ACQUISITION

    requires:
      - VECTA.DWI.ACQ.REVERSE_PE_AVAILABLE

    applies_to:
      - dwi_connectomics

    condition:
      all:
        - variable: VECTA.DWI.ACQ.REVERSE_PE_AVAILABLE
          operator: equals
          value: false
      # If REVERSE_PE_AVAILABLE.state == unknown, criterion_status = unknown
      # and NO finding is emitted (per Output Tech Spec §55 prohibited case).

    finding:
      label: Complementary phase-encoding reference unavailable
      category: acquisition_integrity

      observed_condition:
        reverse_pe_available: false

      reference_condition:
        profile: dwi_connectomics
        preference: reverse_pe

      severity:
        level: major
        status: provisional
        basis:
          - evidence_type: pipeline_requirement
            evidence_ref: EV-DWI-PE-001

      confidence:
        default: high
        components:
          source_authority: high
          source_agreement: high
          extraction_determinism: high
          classification_ambiguity: low

      potential_effects:
        - effect_id: distortion_correction_strategy_constrained
          relation: plausible
          evidence_refs: [EV-DWI-PE-001]
          wording: |
            May constrain the selected distortion-correction strategy;
            alternative approaches (fieldmap-based, synthetic) may be
            required.
          causal_claim: false
        - effect_id: registration_uncertainty
          relation: plausible
          evidence_refs: [EV-DWI-PE-001]
          wording: |
            Residual EPI distortions may increase registration uncertainty
            between DWI and anatomical reference.
          causal_claim: false
        - effect_id: tractography_uncertainty
          relation: plausible
          evidence_refs: [EV-DWI-PE-001]
          wording: |
            Downstream tractography may be affected by residual distortion.
          causal_claim: false

      recommended_actions:
        - action_id: review_distortion_strategy
          action_class: review
          text: |
            Review distortion-correction strategy and document the
            acquisition limitation in analysis notes.
          automated: false
          changes_source_data: false
          requires_human_approval: true
        - action_id: consider_alternative_processing
          action_class: alternative_processing
          text: |
            Consider fieldmap-based or synthetic-fieldmap distortion
            correction if available for the selected pipeline.
          automated: false
          changes_source_data: false
          requires_human_approval: true

      empirical_status:
        state: not_tested       # will be populated after Paper 1 analysis
        study_ref: null
        outcome_ref: null
        effect_ref: null
        evidence_version: null

    evidence_refs:
      - EV-DWI-PE-001

    tests:
      - TEST-REVPE-001    # DWI AP + valid PA reference → satisfied
      - TEST-REVPE-002    # DWI AP + no reference + complete inventory → finding
      - TEST-REVPE-003    # DWI present + PE metadata unavailable → unknown (no finding)

  # ─────────────────────────────────────────────────────────────────────────
  # VECTA-DWI-001 — Phase-encoding direction unknown (evidence insufficiency)
  # ─────────────────────────────────────────────────────────────────────────
  - criterion_id: VECTA-DWI-001
    version: 0.1.0
    name: phase_encoding_direction_unknown
    lifecycle_origin: L3_METADATA
    status: active

    requires:
      - VECTA.DWI.ACQ.PE_DIRECTION

    applies_to:
      - dwi_connectomics

    condition:
      all:
        - variable: VECTA.DWI.ACQ.PE_DIRECTION
          state: unknown

    finding:
      label: Phase-encoding direction cannot be determined
      category: evidence_insufficiency
      observed_condition:
        pe_direction_state: unknown
      reference_condition:
        profile: dwi_connectomics
        essential_metadata:
          - phase_encoding_direction
      severity:
        level: major
        status: provisional
        basis:
          - evidence_type: pipeline_requirement
            evidence_ref: EV-DWI-PE-002
      confidence:
        default: high
      potential_effects:
        - effect_id: distortion_correction_configuration_ambiguous
          relation: plausible
          evidence_refs: [EV-DWI-PE-002]
          wording: |
            Selected distortion-correction strategy may be ambiguous or
            require manual configuration in the absence of a documented
            PE direction.
          causal_claim: false
        - effect_id: manual_intervention_required
          relation: plausible
          evidence_refs: [EV-DWI-PE-002]
          wording: |
            The pipeline is likely to require case-specific human review
            to select or approve a distortion-correction path.
          causal_claim: false
      recommended_actions:
        - action_id: recover_pe_from_source
          action_class: re_export
          text: |
            Attempt to recover PhaseEncodingDirection from source DICOM
            or scanner protocol documentation, then regenerate the BIDS
            sidecar.
          automated: false
          changes_source_data: false
          requires_human_approval: true
        - action_id: document_pe_absence
          action_class: document
          text: |
            If PhaseEncodingDirection cannot be recovered, document the
            limitation in the study's analysis notes.
          automated: false
          changes_source_data: false
          requires_human_approval: true
      empirical_status:
        state: not_tested

    evidence_refs:
      - EV-DWI-PE-002
    tests:
      - TEST-PEUNK-001

  # ─────────────────────────────────────────────────────────────────────────
  # VECTA-DWI-021 — Essential metadata insufficient
  # ─────────────────────────────────────────────────────────────────────────
  - criterion_id: VECTA-DWI-021
    version: 0.1.0
    name: essential_metadata_insufficient
    lifecycle_origin: L3_METADATA
    status: active

    requires:
      - VECTA.DWI.ACQ.PE_DIRECTION
      - VECTA.DWI.ACQ.TOTAL_READOUT_TIME_PRESENT

    applies_to:
      - dwi_connectomics

    condition:
      any:
        - variable: VECTA.DWI.ACQ.PE_DIRECTION
          state: unknown
        - variable: VECTA.DWI.ACQ.TOTAL_READOUT_TIME_PRESENT
          operator: equals
          value: false

    finding:
      label: One or more essential metadata items are missing or unknown
      category: metadata_integrity
      observed_condition:
        essential_metadata_missing_or_unknown: true
      reference_condition:
        profile: dwi_connectomics
        essential_metadata:
          - phase_encoding_direction
          - total_readout_time_or_equivalent
      severity:
        level: major
        status: provisional
        basis:
          - evidence_type: pipeline_requirement
            evidence_ref: EV-DWI-META-001
      confidence:
        default: high
      potential_effects:
        - effect_id: distortion_correction_strategy_constrained
          relation: plausible
          evidence_refs: [EV-DWI-META-001]
          wording: |
            Distortion correction may fall back to a suboptimal strategy
            or be skipped when essential PE / timing metadata are absent.
          causal_claim: false
      recommended_actions:
        - action_id: review_essential_metadata
          action_class: review
          text: |
            Confirm which essential metadata items are missing and
            recover them from source data or protocol documentation
            where possible.
          automated: false
          changes_source_data: false
          requires_human_approval: true
      empirical_status:
        state: not_tested

    evidence_refs:
      - EV-DWI-META-001
    tests:
      - TEST-METASUFF-001

  # ─────────────────────────────────────────────────────────────────────────
  # VECTA-DWI-040 — Session lacks a DWI acquisition entirely
  # Surfaced by CIDUR sessions (sub-002/ses-1, sub-044/ses-2) where the
  # BIDS session exists but has no dwi/ directory; the downstream pipeline
  # created output dirs but produced no derivatives.
  # This is a cohort-integrity signal that should fire BEFORE any pipeline
  # runs, so triage happens before compute is wasted.
  # ─────────────────────────────────────────────────────────────────────────
  - criterion_id: VECTA-DWI-040
    version: 0.1.0
    name: session_has_no_dwi
    lifecycle_origin: L4_REPRESENTATION
    status: active

    requires:
      - VECTA.DWI.BIDS.DWI_PRESENT

    applies_to:
      - dwi_connectomics

    condition:
      all:
        - variable: VECTA.DWI.BIDS.DWI_PRESENT
          operator: equals
          value: false

    finding:
      label: Session has no DWI acquisition
      category: cohort_integrity
      observed_condition:
        session_has_dwi: false
      reference_condition:
        profile: dwi_connectomics
        requires: [dwi]
      severity:
        level: critical
        status: provisional
        basis:
          - evidence_type: pipeline_requirement
            evidence_ref: EV-DWI-COHORT-001
      confidence:
        default: high
      potential_effects:
        - effect_id: pipeline_will_produce_no_derivatives
          relation: plausible
          evidence_refs: [EV-DWI-COHORT-001]
          wording: |
            Any DWI processing workflow will either refuse to run or
            create an empty output tree with no derivatives.
          causal_claim: false
      recommended_actions:
        - action_id: exclude_from_dwi_analysis
          action_class: exclude
          text: |
            Exclude this session from DWI-dependent analyses. Recover
            the DWI acquisition from source if it was accidentally
            dropped during conversion; otherwise document the exclusion.
          automated: false
          changes_source_data: false
          requires_human_approval: true
      empirical_status:
        state: not_tested

    evidence_refs:
      - EV-DWI-COHORT-001
    tests:
      - TEST-COHORT-NODWI-001

  # ─────────────────────────────────────────────────────────────────────────
  # VECTA-DWI-030 — DWI gradient files (bval / bvec) missing
  # Surfaced by CIDUR's "DWI missing .bval/.bvec" manual exclusion cases;
  # QSIPrep and any gradient-aware pipeline require both files.
  # ─────────────────────────────────────────────────────────────────────────
  - criterion_id: VECTA-DWI-030
    version: 0.1.0
    name: dwi_gradient_files_missing
    lifecycle_origin: L4_REPRESENTATION
    status: active

    requires:
      - VECTA.DWI.ACQ.BVAL_COUNT
      - VECTA.DWI.ACQ.BVEC_COUNT

    applies_to:
      - dwi_connectomics

    condition:
      any:
        - variable: VECTA.DWI.ACQ.BVAL_COUNT
          state: unknown
        - variable: VECTA.DWI.ACQ.BVEC_COUNT
          state: unknown

    finding:
      label: DWI gradient file (.bval and/or .bvec) missing
      category: representation_integrity
      observed_condition:
        bval_or_bvec_absent: true
      reference_condition:
        profile: dwi_connectomics
        required_files:
          - .bval
          - .bvec
      severity:
        level: critical
        status: provisional
        basis:
          - evidence_type: pipeline_requirement
            evidence_ref: EV-DWI-GRAD-001
      confidence:
        default: high
      potential_effects:
        - effect_id: gradient_aware_preprocessing_impossible
          relation: plausible
          evidence_refs: [EV-DWI-GRAD-001]
          wording: |
            Without both .bval and .bvec, gradient-aware preprocessing
            (QSIPrep gradient checks, EDDY, tractography) cannot run.
            Some pipelines may reconstruct a nominal table from DICOM
            if available, but this fallback is neither guaranteed nor
            valid for all vendors.
          causal_claim: false
      recommended_actions:
        - action_id: recover_gradients_from_dicom
          action_class: re_export
          text: |
            Attempt to reconstruct .bval and .bvec from original DICOM
            (dcm2niix -b y) or from the acquisition protocol
            documentation. Then rerun BIDS conversion.
          automated: false
          changes_source_data: false
          requires_human_approval: true
        - action_id: exclude_from_analysis_if_unrecoverable
          action_class: exclude
          text: |
            If gradient tables cannot be recovered, exclude this DWI
            session from analyses requiring gradient information. Document
            the exclusion.
          automated: false
          changes_source_data: false
          requires_human_approval: true
      empirical_status:
        state: not_tested

    evidence_refs:
      - EV-DWI-GRAD-001
    tests:
      - TEST-GRADMISS-001

  # ─────────────────────────────────────────────────────────────────────────
  # VECTA-DWI-031 — bvec gradient vectors implausible (non-unit norms)
  # Fires when BVEC_PLAUSIBILITY == false, i.e., one or more non-b0 gradient
  # vectors deviate from unit magnitude beyond the tolerance in vector_norm.
  # A corrupt or vendor-rescaled bvec will silently pass all BIDS checks
  # but will misspecify the diffusion directions fed to tractography.
  # ─────────────────────────────────────────────────────────────────────────
  - criterion_id: VECTA-DWI-031
    version: 0.1.0
    name: dwi_bvec_implausible
    lifecycle_origin: L4_REPRESENTATION
    status: active

    requires:
      - VECTA.DWI.ACQ.BVEC_PLAUSIBILITY

    applies_to:
      - dwi_connectomics

    condition:
      all:
        - variable: VECTA.DWI.ACQ.BVEC_PLAUSIBILITY
          operator: equals
          value: false

    finding:
      label: DWI gradient vectors have implausible norms
      category: representation_integrity

      observed_condition:
        bvec_plausibility: false

      reference_condition:
        profile: dwi_connectomics
        requirement: all non-b0 gradient vectors have unit magnitude

      severity:
        level: critical
        status: provisional
        basis:
          - evidence_type: pipeline_requirement
            evidence_ref: EV-DWI-GRAD-001

      confidence:
        default: high

      potential_effects:
        - effect_id: tractography_direction_error
          relation: plausible
          evidence_refs: [EV-DWI-GRAD-001]
          wording: |
            Non-unit gradient vectors cause diffusion-direction errors in
            every tensor-estimation and tractography step; downstream
            FA/MD maps and tractography streamlines will be incorrect
            even if the pipeline completes without errors.
          causal_claim: false
        - effect_id: silent_pipeline_completion_masking_error
          relation: plausible
          evidence_refs: [EV-DWI-GRAD-001]
          wording: |
            Pipelines do not typically validate gradient vector norms at
            runtime; a corrupt bvec may produce numerically plausible-
            looking outputs while encoding a systematic error.
          causal_claim: false

      recommended_actions:
        - action_id: recover_bvec_from_dicom
          action_class: re_export
          text: |
            Re-export the bvec file from the original DICOM using
            dcm2niix (dcm2niix -b y). Confirm all non-b0 vector
            norms are within 0.01 of 1.0 after re-export.
          automated: false
          changes_source_data: false
          requires_human_approval: true
        - action_id: normalise_bvec_if_vendor_scaled
          action_class: repair_representation
          text: |
            If the vendor stores gradients with a non-unit convention,
            normalise each row to unit magnitude and document the
            correction in the study's analysis notes.
          automated: false
          changes_source_data: false
          requires_human_approval: true

      empirical_status:
        state: not_tested
        study_ref: null
        outcome_ref: null

    evidence_refs:
      - EV-DWI-GRAD-001

    tests:
      - TEST-BVECPLAUS-001   # all non-b0 vectors unit-normed → satisfied
      - TEST-BVECPLAUS-002   # one vector rescaled to norm 0.5 → finding

  # ─────────────────────────────────────────────────────────────────────────
  # VECTA-DWI-050 — DWI DICOM series geometry inconsistent
  # (Source module — only evaluable when DICOM inventory is available)
  # ─────────────────────────────────────────────────────────────────────────
  - criterion_id: VECTA-DWI-050
    version: 0.1.0
    name: dwi_dicom_geometry_inconsistent
    lifecycle_origin: L2_SOURCE
    status: active

    requires:
      - VECTA.DWI.DICOM.SERIES_GEOMETRY_CONSISTENT

    applies_to:
      - dwi_connectomics

    condition:
      all:
        - variable: VECTA.DWI.DICOM.SERIES_GEOMETRY_CONSISTENT
          operator: equals
          value: false

    finding:
      label: DWI DICOM series has internally inconsistent geometry
      category: source_integrity
      observed_condition:
        dwi_series_geometry_consistent: false
      reference_condition:
        profile: dwi_connectomics
      severity:
        level: major
        status: provisional
        basis:
          - evidence_type: pipeline_requirement
            evidence_ref: EV-DWI-DCM-GEO-001
      confidence:
        default: high
      potential_effects:
        - effect_id: conversion_failure_or_ambiguity
          relation: plausible
          evidence_refs: [EV-DWI-DCM-GEO-001]
          wording: |
            dcm2niix or equivalent converters typically fail or split
            series when instance geometry is inconsistent.
          causal_claim: false
      recommended_actions:
        - action_id: reexport_dicom_series
          action_class: re_export
          text: |
            Re-export the affected DWI series from source PACS/XNAT and
            verify instance-level geometry before conversion.
          automated: false
          changes_source_data: false
          requires_human_approval: true
      empirical_status:
        state: not_tested

    evidence_refs:
      - EV-DWI-DCM-GEO-001
    tests: []

  # ─────────────────────────────────────────────────────────────────────────
  # VECTA-DWI-060 — DICOM/BIDS field-strength disagreement
  # (Source module — transformation-fidelity check)
  # ─────────────────────────────────────────────────────────────────────────
  - criterion_id: VECTA-DWI-060
    version: 0.1.0
    name: dicom_bids_field_strength_disagreement
    lifecycle_origin: L4_REPRESENTATION
    status: active

    requires:
      - VECTA.DWI.DICOM.FIELD_STRENGTH_AGREES_WITH_BIDS

    applies_to:
      - dwi_connectomics

    condition:
      all:
        - variable: VECTA.DWI.DICOM.FIELD_STRENGTH_AGREES_WITH_BIDS
          operator: equals
          value: false

    finding:
      label: MagneticFieldStrength disagrees between DICOM and BIDS sidecar
      category: representation_integrity
      observed_condition:
        field_strength_agrees_dicom_bids: false
      reference_condition:
        profile: dwi_connectomics
      severity:
        level: moderate
        status: provisional
        basis:
          - evidence_type: pipeline_requirement
            evidence_ref: EV-DWI-DCM-FIDELITY-001
      confidence:
        default: high
      potential_effects:
        - effect_id: measurement_noncomparability
          relation: plausible
          evidence_refs: [EV-DWI-DCM-FIDELITY-001]
          wording: |
            Downstream analyses that assume the BIDS-recorded field
            strength may compute incorrect scaling factors when the source
            DICOM reports a different value.
          causal_claim: false
      recommended_actions:
        - action_id: reconcile_field_strength
          action_class: repair_representation
          text: |
            Reconcile the BIDS sidecar with the source DICOM value and
            regenerate the sidecar from the authoritative source.
          automated: false
          changes_source_data: false
          requires_human_approval: true
      empirical_status:
        state: not_tested

    evidence_refs:
      - EV-DWI-DCM-FIDELITY-001
    tests: []
