# BIDS representation variables.
# Source: Paper 1 §14 (BIDS: validator errors/warnings, sidecar completeness,
# metadata relationships, naming/structure).

version: 0.1.0

variables:

  - variable_id: VECTA.DWI.BIDS.VALIDATOR_ERROR_COUNT
    version: 0.1.0
    name: BIDS Validator error count
    lifecycle_layer: L5_CONFORMANCE
    domain: bids
    type:
      primitive: integer
      nullable: true
    allowed_states:
      - observed
      - unknown
      - extraction_failed
    sources:
      bids_validator:
        field: errors
    canonical:
      type: integer
      unit: count
    extraction:
      algorithm: extract_validator_error_count_v1
    notes: |
      Validator version must be pinned in provenance. A change in validator
      version can change error counts even when the dataset is unchanged.
    paper1_role: birth_predictor
    criterion_eval: deferred_v0.2
    deferred_criterion_note: |
      No v0.1 criterion fires on a non-zero error count. The variable is
      collected and reported; a threshold-based criterion (e.g., errors > 0
      that are DWI-relevant) requires a stable filter-by-issue-code contract
      with BIDS Validator — deferred to v0.2.
    evidence_refs: []
    tests: []

  - variable_id: VECTA.DWI.BIDS.VALIDATOR_WARNING_COUNT
    version: 0.1.0
    name: BIDS Validator warning count
    lifecycle_layer: L5_CONFORMANCE
    domain: bids
    type:
      primitive: integer
      nullable: true
    allowed_states:
      - observed
      - unknown
      - extraction_failed
    sources:
      bids_validator:
        field: warnings
    canonical:
      type: integer
      unit: count
    extraction:
      algorithm: extract_validator_warning_count_v1
    paper1_role: birth_predictor
    criterion_eval: deferred_v0.2
    deferred_criterion_note: |
      Warnings are informational; no v0.1 criterion fires on warning count.
      Deferred to v0.2 alongside the error-count criterion.
    evidence_refs: []
    tests: []

  - variable_id: VECTA.DWI.BIDS.DWI_PRESENT
    version: 0.1.0
    name: Session contains at least one DWI acquisition
    lifecycle_layer: L4_REPRESENTATION
    domain: bids
    type:
      primitive: boolean
      nullable: false
    allowed_states:
      - derived
    dependencies: []
    derived: true
    formula_id: derive_dwi_present_v1
    formula_pseudocode: |
      DWI_PRESENT := len(session.dwi_entities) > 0
    reference:
      type: intended_use_profile
      profile: dwi_connectomics
    extraction:
      algorithm: derive_dwi_present_v1
    paper1_role: birth_predictor
    notes: |
      Boolean shortcut used by VECTA-DWI-040. The structured object
      variable REQUIRED_SERIES_PRESENT retains the full missing/present
      map; this dedicated boolean exists so declarative criterion
      predicates can use a simple `equals false` check.
    evidence_refs:
      - EV-DWI-COHORT-001
    tests: []

  - variable_id: VECTA.DWI.BIDS.REQUIRED_SERIES_PRESENT
    version: 0.1.0
    name: Required series present for dwi_connectomics profile
    lifecycle_layer: L4_REPRESENTATION
    domain: bids
    type:
      primitive: object
      nullable: false
    allowed_states:
      - derived
      - unknown
      - extraction_failed
    dependencies: []
    derived: true
    formula_id: required_series_present_v1
    formula_pseudocode: |
      required_series := profile.requires (e.g., dwi, anatomical_t1)
      for each required entry:
        present[entry] := any BIDS file matches expected suffix/entity pattern
      return {present: {dwi: bool, anatomical_t1: bool, ...},
              missing: [list of missing]}
    reference:
      type: intended_use_profile
      profile: dwi_connectomics
    extraction:
      algorithm: derive_required_series_present_v1
    paper1_role: birth_predictor
    criterion_eval: deferred_v0.2
    deferred_criterion_note: |
      Structured object variable used for reporting only in v0.1. A criterion
      firing on `missing` entries (e.g., no T1w when one is required by the
      profile) is deferred to v0.2 when the T1w quality assessment scope is
      added.
    notes: |
      Emits structured object (not a bare boolean) so the missing list is
      preserved. A scalar ratio alone would be insufficient per Spec
      Blueprint §9.1.
    evidence_refs: []
    tests: []
