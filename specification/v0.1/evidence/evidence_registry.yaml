# Evidence registry.
# Source: Spec Blueprint §18.
#
# Every criterion cites at least one evidence entry that justifies its
# existence. Evidence is stored separately from criteria so that multiple
# criteria can share the same source, and so that domain reviewers can
# audit the scientific basis of the framework without reading rule code.

version: 0.1.0

evidence:

  - evidence_id: EV-DWI-PE-001
    type: pipeline_requirement
    title: Complementary phase-encoding support for susceptibility-distortion correction
    source: QSIPrep documented processing requirement
    version_scope: specified_version    # tied to the pinned QSIPrep version at freeze
    status: active
    supports:
      - VECTA-DWI-014
    strength:
      category: operational_requirement
    notes: |
      Absence of a complementary phase-encoded reference constrains the
      distortion-correction strategy available to QSIPrep. Does not imply
      universal diagnostic inadequacy when absent.

  - evidence_id: EV-DWI-PE-002
    type: pipeline_requirement
    title: PhaseEncodingDirection is required to configure susceptibility-distortion correction
    source: QSIPrep / FSL topup documented processing requirement
    version_scope: specified_version
    status: active
    supports:
      - VECTA-DWI-001
    strength:
      category: operational_requirement
    notes: |
      Absence of PhaseEncodingDirection prevents the pipeline from
      selecting or configuring distortion correction unambiguously.
      Absence in metadata does not by itself indicate a corrupt
      acquisition — it is an evidence-insufficiency condition.

  - evidence_id: EV-DWI-COHORT-001
    type: pipeline_requirement
    title: A session under the dwi_connectomics profile requires at least one DWI entity
    source: BIDS specification (dwi entity); QSIPrep required inputs
    version_scope: specified_version
    status: active
    supports:
      - VECTA-DWI-040
    strength:
      category: operational_requirement
    notes: |
      A subject/session that lacks a dwi/ directory in BIDS cannot be
      processed by any DWI pipeline. Surfaced empirically by CIDUR
      sub-002/ses-1 and sub-044/ses-2 where QSIPrep created output
      directories but produced no derivatives because no DWI was
      supplied. Vecta should emit this finding BEFORE the pipeline
      attempts to run.

  - evidence_id: EV-DWI-GRAD-001
    type: pipeline_requirement
    title: BIDS DWI requires companion .bval and .bvec files
    source: BIDS specification (dwi entity); QSIPrep / dcm2niix documentation
    version_scope: specified_version
    status: active
    supports:
      - VECTA-DWI-030
    strength:
      category: operational_requirement
    notes: |
      Every DWI NIfTI in BIDS must be accompanied by a matching .bval
      and .bvec file. Absence prevents gradient-aware preprocessing
      (QSIPrep gradient sanity checks, EDDY, tractography) from running
      at all. This is distinct from the plausibility check
      (VECTA.DWI.ACQ.BVEC_PLAUSIBILITY, which assumes both files are
      present) — this criterion catches the presence-vs-absence case
      surfaced by CIDUR's "DWI missing .bval/.bvec" manual exclusions.

  - evidence_id: EV-DWI-DCM-GEO-001
    type: pipeline_requirement
    title: Intra-series DICOM geometry consistency required for DWI reconstruction
    source: QSIPrep / dcm2niix conversion requirements
    version_scope: specified_version
    status: active
    supports:
      - VECTA-DWI-050
    strength:
      category: operational_requirement
    notes: |
      Instances within one DWI series should share PixelSpacing,
      SliceThickness, and (Rows, Columns). Inconsistency indicates a
      partially-converted export or an accidentally-merged series and
      typically breaks conversion.

  - evidence_id: EV-DWI-DCM-FIDELITY-001
    type: pipeline_requirement
    title: DICOM-to-BIDS transformation must preserve critical acquisition parameters
    source: BIDS specification; dcm2niix documentation
    version_scope: specified_version
    status: active
    supports:
      - VECTA-DWI-060
    strength:
      category: operational_requirement
    notes: |
      Fields such as MagneticFieldStrength must survive conversion
      unchanged (within canonical-unit tolerance). Disagreement between
      DICOM and BIDS is a representation-integrity finding, not a data
      finding to be silently resolved.

  - evidence_id: EV-DWI-META-001
    type: pipeline_requirement
    title: PhaseEncodingDirection + TotalReadoutTime (or equivalent) are essential for topup-style susceptibility correction
    source: FSL topup documentation; QSIPrep documented requirements
    version_scope: specified_version
    status: active
    supports:
      - VECTA-DWI-021
    strength:
      category: operational_requirement
    notes: |
      Both PhaseEncodingDirection and TotalReadoutTime (or equivalent
      timing information derivable from EffectiveEchoSpacing +
      ReconMatrixPE) must be available for topup-based distortion
      correction. Absence forces the pipeline into a fallback strategy
      or a documented limitation.
