# Default tolerance registry.
# Source: Spec Blueprint §12.
#
# CRITICAL: values below are illustrative placeholders. Every tolerance
# must have a justified basis (standard, pipeline requirement, literature,
# expert consensus, or empirical calibration) before v0.1 freeze. Do not
# treat these as authoritative in any analysis until reviewed.
#
# Format: each entry has type (absolute|relative), value, optional unit,
# and basis (with status = provisional until justified).

